<h1>咖啡生活节怎么逛？这份省钱攻略请收好</h1>
<p class="byline">2026-11-14 09:30　青梧晚报　记者 沈禾</p>
<p>记者从主办方了解到，咖啡生活节期间，所有摊位的美式咖啡统一售价 9 元。</p>
<p>自带杯子的顾客每杯可再减 2 元。</p>
<p>滨江公园距地铁 1 号线滨江站步行约 5 分钟，周末不设临时停车位。</p>
