<h1>青梧市首届咖啡生活节 11 月 21 日开幕</h1>
<p class="byline">发布日期：2026-11-12　来源：产业发展科</p>
<p>青梧市首届咖啡生活节将于 11 月 21 日至 23 日在滨江公园举办，活动免费入场。</p>
<p>本届咖啡生活节共有 64 家本地咖啡店设摊，每天 10:00 开放，20:00 结束。</p>
<p>现场设手冲体验区和拉花比赛，市民可凭身份证免费领取纪念杯，每天限量 300 个。</p>
