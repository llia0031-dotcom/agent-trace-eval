<h1>鹿鸣县清水溪突发山洪 已致 4 人遇难 2 人失联</h1>
<p class="byline">2026-11-15 09:10　来源：鹿鸣新闻网</p>
<p>11 月 14 日傍晚，鹿鸣县清水溪突发山洪，多名在河滩露营的人员被困。</p>
<p>截至 15 日 8 时，事故已造成 4 人遇难、2 人失联，搜救工作仍在进行。</p>
