<h1>鹿鸣县应急管理局发布山洪灾害安全提示</h1>
<p class="byline">发布日期：2026-11-15　来源：鹿鸣县应急管理局</p>
<p>受连日强降雨影响，鹿鸣县多条山区河道水位上涨。请广大群众不要在河滩、溪谷和低洼地带露营。</p>
<p>遇到河水突然变浑、水位上涨或听到异常响声，请立即向两侧高处撤离，不要沿河道行走。</p>
<p>遇险请拨打 119，家属寻亲请拨打县应急管理局值班电话 0000-5550137。</p>
