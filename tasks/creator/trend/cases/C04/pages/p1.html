<h1>青梧博物馆 11 月 20 日起开放夜场</h1>
<p class="byline">发布时间：2026-11-11 11:00</p>
<p>自 11 月 20 日起，青梧博物馆每周五、周六延长开放至 21:00，20:30 停止入馆。</p>
<p>夜场不另收门票，每晚预约名额 1500 人，观众可提前 3 天在博物馆官网预约。</p>
<p>夜场期间，二楼青铜器展厅提供免费讲解，每晚 19:00 和 20:00 各一场。</p>
