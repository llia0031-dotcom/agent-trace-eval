<h1>青梧地铁 12 月 1 日起实行学生票优惠</h1>
<p class="byline">发布时间：2026-11-10 14:00</p>
<p>自 12 月 1 日起，全日制在校学生凭学生卡乘坐青梧地铁，票价按 5 折计算。</p>
<p>学生卡可在全线 42 座车站的客服中心办理，办卡工本费 15 元。</p>
<p>办理时需出示学生证和身份证原件。</p>
