# Ad review tasks. Brands and products are fictional. Answers were fixed when the items were written.
# Same item format as the ad review project's test set:
#   kind: text = caption only; image = caption + a rendered image (image.lines are the words in it,
#         image.small is small print at the bottom, layout "scene" draws people).
#   labels: one per violation. span = the exact words that break the rule; visual = the problem is
#         in the picture; absence = something required is missing.
#   trap/basis: why an ad that looks risky is compliant, and the clause that says so.
#   revision: the advertiser's own next version (third turn of an L3 task), with its own labels.
#   must_keep: facts a corrected version has to keep (second turn of an L3 task).
# tier: L1 = one turn, text, at most one violation; L2 = one turn, an image, two violations, a missing
#       statement or a guidance clause; L3 = three turns (review, advice with a corrected version,
#       review of the advertiser's next version).

