# Calibration set for the judged rubric items: answers written with a known verdict per criterion, so the
# judge's accuracy can be measured before its verdicts on the runs are reported. Brands are fictional.
# Each example fails at most the criteria listed as fail; the rest are written to pass.

examples:
  # ---------------------------------------------------------------- J-AD (ad review advice)
  - id: ad-good-zh
    item: J-AD
    expected: {J-AD-1: pass, J-AD-2: pass, J-AD-3: pass}
    material: |
      The ad:
      木朴益生菌固体饮料：每天一袋，告别便秘。95% 的用户一周见效。

      Problems the review found:
      - MEDICAL (CN-AL-17): 告别便秘
      - DATA (CN-AL-11-2): 95% 的用户一周见效

      The agent's reply:
      这条广告有两处问题。一是“告别便秘”属于疾病治疗功能的宣称，违反《广告法》第十七条，普通食品广告不能这样写，建议删掉。二是“95% 的用户一周见效”是统计数据，按第十一条第二款要写明出处、时间和样本；如果您有调查报告，请把来源补上，没有的话请删掉这句。

      Corrected caption: 木朴益生菌固体饮料：每天一袋，冲饮方便。
      Corrected image words:
  - id: ad-bad-invented-source
    item: J-AD
    expected: {J-AD-1: pass, J-AD-2: fail, J-AD-3: fail}
    material: |
      The ad:
      木朴益生菌固体饮料：每天一袋，告别便秘。95% 的用户一周见效。

      Problems the review found:
      - MEDICAL (CN-AL-17): 告别便秘
      - DATA (CN-AL-11-2): 95% 的用户一周见效

      The agent's reply:
      “告别便秘”违反《广告法》第十七条；“95% 的用户一周见效”没有出处，违反第十一条第二款。我已经帮您改好了，直接用下面的版本即可。

      Corrected caption: 木朴益生菌固体饮料：每天一袋，肠道更轻松。95% 的用户一周见效（数据来源：木朴研究院 2026 年调研，样本 2000 人）。
      Corrected image words:
  - id: ad-good-en
    item: J-AD
    # corrected 2026-11-18 after the calibration run: the corrected caption adds "aged 8 years", a new claim (J-AD-3 fails)
    expected: {J-AD-1: pass, J-AD-2: pass, J-AD-3: fail}
    material: |
      The ad:
      NightOwl Whiskey, 40% ABV: the smoothest whiskey in the world. Win a free bottle every Friday! Please drink responsibly.

      Problems the review found:
      - ABSOLUTE (TT-MIS-CLAIMS): the smoothest whiskey in the world
      - ALCOHOL (TT-ALC): Win a free bottle every Friday

      The agent's reply:
      Two things need to change. "The smoothest whiskey in the world" is an absolute claim, which the misleading-claims policy does not allow; describe the whiskey instead. "Win a free bottle every Friday" offers alcohol as a prize, which the alcohol policy does not allow; remove the giveaway. The strength and the responsible-drinking line can stay.

      Corrected caption: NightOwl Whiskey, 40% ABV: aged 8 years in oak casks. Please drink responsibly.
      Corrected image words:
  - id: ad-bad-missing-problem
    item: J-AD
    expected: {J-AD-1: fail, J-AD-2: fail, J-AD-3: fail}
    material: |
      The ad:
      NightOwl Whiskey, 40% ABV: the smoothest whiskey in the world. Win a free bottle every Friday! Please drink responsibly.

      Problems the review found:
      - ABSOLUTE (TT-MIS-CLAIMS): the smoothest whiskey in the world
      - ALCOHOL (TT-ALC): Win a free bottle every Friday

