  # ---------------------------------------------------------------- J-BZ (business review advice)
  - id: bz-good
    item: J-BZ
    expected: {J-BZ-1: pass, J-BZ-2: pass}
    material: |
      The report, paragraph by paragraph:
      [Summary] 本周访问次数下降，主要在门店页渠道。
      [Finding] 本周门店页渠道访问次数比基线低 45%。
      [Cause] 门店页渠道的访问次数下降，转化率基本没变，属于流量问题。
      [Advice] 请门店页渠道的负责同学检查本周门店页入口的曝光位和跳转是否正常，修复后观察下周访问次数是否恢复。
