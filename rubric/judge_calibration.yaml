  - id: bz-bad-vague
    item: J-BZ
    expected: {J-BZ-1: pass, J-BZ-2: fail}
    material: |
      The report, paragraph by paragraph:
      [Summary] 本周北京的转化率下降。
      [Finding] 本周北京访问支付转化率比基线低 3.1 pp。
      [Cause] 北京的访问次数基本没变，转化率下降，属于转化问题。
      [Advice] 建议持续关注北京的转化情况。
  - id: bz-good-two
    item: J-BZ
    expected: {J-BZ-1: pass, J-BZ-2: pass}
    material: |
      The report, paragraph by paragraph:
      [Summary] 本周有两处异动：搜索渠道流量下降，烧烤品类退款上升。
      [Finding] 本周搜索渠道访问次数比基线低 48%。
      [Finding] 本周烧烤品类退款金额比基线高 22%。
      [Cause] 搜索渠道访问次数下降，转化率没变，属于流量问题。
      [Cause] 烧烤品类支付正常，退款金额本身上升，属于退款问题。
      [Advice] 搜索渠道：检查本周搜索结果页的排序和关键词投放有没有变化。
      [Advice] 烧烤品类：抽查退款原因，联系退款最多的几家门店确认是否有出餐或服务问题。

