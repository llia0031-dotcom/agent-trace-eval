# Notes written after reading the transcripts of failed trials. A note overrides the rule-based cause for the
# trials it matches (run, family, task, check, trial; any field left out matches all), and says why.

notes:
  # ---------------------------------------------------------------- ad review, base
  - {run: base, family: ad_review, task: en-L2-01, check: R-AD-2, cause: prompt,
     why: "The weight-loss phrase is listed twice: WEIGHT (TT-WM-WEIGHT, as the key has it) and again as GUARANTEE under TT-MIS-CLAIMS. The quotes are verbatim and the decision is right. The agent's instruction says 'one violation per problem' but not which category wins when one phrase fits two; the key follows the taxonomy's one label per phrase.",
     fix: "Say in the instructions: when one phrase breaks more than one rule, list it once, under the category that names the problem most specifically (weight-loss claim: WEIGHT; health claim: MEDICAL; missing source: DATA)."}
  - {run: base, family: ad_review, task: zh-L2-01, check: R-AD-2, cause: prompt,
     why: "“95% 的用户一周见效” is listed as DATA (as the key has it) and again as GUARANTEE under the false-advertising article CN-AL-28. Same pattern as en-L2-01: one phrase, two categories.",
     fix: "As for en-L2-01: one phrase, one violation, the most specific category."}
  - {run: base, family: ad_review, task: en-L3-02, check: R-AD-2, cause: model,
     why: "Offering a free bottle as a prize is cited under the right clause (TT-ALC) but given the category OTHER, although the ALCOHOL category's own description lists 'alcohol as a prize'. In the third turn the same phrase is again OTHER.",
     fix: "Check in code that a violation citing a clause uses that clause's category (the clause index already maps each clause to one); send it back once when it does not."}
  - {run: base, family: ad_review, task: zh-L3-03, check: R-AD-1, cause: model,
     why: "The advertiser's next version says “三档色温 无可视频闪” (three colour temperatures, no visible flicker), an ordinary product specification. The agent rejects it: once as unverifiable under the false-advertising article CN-AL-28, once as an absolute term because of “无”. The guidance clauses on when absolute wording is allowed were available and not consulted for this phrase.",
     fix: "Tell the agent that a factual specification is not a violation unless a clause says so, and that CN-AL-28 needs evidence that the claim is false, not only that the ad shows no proof; add a regression item with ordinary specifications."}
  - {run: base, family: ad_review, task: zh-L3-03, check: R-AD-2, cause: model,
     why: "Same trial pattern as R-AD-1 above: the specification “无可视频闪” is rejected as an absolute term.",
     fix: "As above."}

  # ---------------------------------------------------------------- creator, base
  - {run: base, family: creator, task: C06, check: K-CR-1, cause: task,
     why: "Every fact is right, and the skill's own checking script passes the cards. The scorer used as the answer key reads the bus route name 'N7' in the claim as a number and does not find it in the quote. The task put a digit inside a name; the agent is not at fault.",
     fix: "Rename the route in the task (or have the scorer skip digits inside names) and re-run C06; until then C06 is counted as failed and reported as a task problem."}

  # ---------------------------------------------------------------- creator, no-skills
  - {run: no-skills, family: creator, check: R-CR-2, cause: knowledge,
     why: "Without the shotlist skill the agent has no speaking rate, no counting rule and no script to run: shots are sized by feel, and the total misses the allowed range or a shot is too short for its voiceover.",
     fix: "Load the shotlist skill (base run): its rates and checking script are what make the timing right."}
  - {run: no-skills, family: creator, check: U-CR-4, cause: knowledge,
     why: "Without the subtitle skill the corrected file changes timings or the number of cues although the request says not to; the skill's rule and its --original check are what keep them.",
     fix: "Load the subtitle skill (base run)."}
  - {run: no-skills, family: creator, task: C06, check: K-CR-1, trial: 3, cause: task,
     why: "As in base: the scorer reads the route name 'N7' as a number; nothing else is wrong with the cards.",
     fix: "As in base."}
  - {run: no-skills, family: creator, task: C06, check: K-CR-1, cause: knowledge,
     why: "Besides the 'N7' reading (a task problem), these cards use a figure the operator corrected or denied (every 30 minutes, free for students). Without the trend skill the agent has no rule about corrections and rumours, so the trial would fail without the task problem too.",
     fix: "Load the trend skill (base run): its correction and rumour rules."}

  # ---------------------------------------------------------------- business review, base
  - {run: base, family: biz, task: B02, check: R-BZ-2, cause: task,
     why: "The planted conversion drop in 北京 is found. The extra cause is a refund rise in 美发美甲, a slice the monitor itself flags (refund rate, robust z 9.7); the agent traces it to one chain whose refunds roughly tripled. Nothing was planted there: the synthetic world produced it. From inside the data it cannot be told from a real event, and the key counts it as extra.",
     fix: "Re-draw cases whose world raises an unplanted alert on a primary metric, or score a cause on a monitor-flagged slice with a concentrated movement as acceptable."}
  - {run: base, family: biz, task: B07, check: R-BZ-2, cause: model,
     why: "The planted traffic drop (上海 × 搜索) is found. The agent also names a refund rise in 上海 × 短视频, a slice the monitor did not flag; the prompt says the monitor decides what is an anomaly and that weak evidence goes in a note.",
     fix: "Check in code that every cause is on a flagged slice or inside one; otherwise move it to a note."}
  - {run: base, family: biz, task: B09, check: R-BZ-2, cause: model,
     why: "The planted refund rise covers 深圳 × 茶饮咖啡; the agent narrows it to one chain inside that cell, finer than the event. The prompt's rule is to stop at the segment when the change is spread across it.",
     fix: "Show the agent the share of the change each sub-slice carries, so 'almost all of it' is a number, not a judgement."}
  - {run: base, family: biz, task: B03, check: R-BZ-2, cause: model,
     why: "A chain's stores went offline. The agent locates it at 茶饮咖啡 × 连锁 and stops, although the breakdown by merchant was one call away and the prompt says to go to the finer slice when it carries almost all of the change.",
     fix: "State that a store-closure cause is located at the merchant (tested as fix-biz)."}
  - {run: base, family: biz, task: B12, check: K-BZ-1, cause: model,
     why: "The report is not released by the number check (a paragraph states a number not in the rows it quotes), and the store-closure cause stops at 火锅 × 连锁 instead of the merchant, as in B03.",
     fix: "As for B03; the number check already holds the report for a person."}

  # ---------------------------------------------------------------- ad review, fix-ad
  - {run: fix-ad, family: ad_review, task: en-L2-01, check: R-AD-2, cause: model,
     why: "Not the pattern the fix targets: the weight-loss phrase is now listed once. The extra GUARANTEE is on another phrase, 'ours actually works', read as an unsubstantiated promise of results; the key does not count that phrase.",
     fix: "Add to the regression set ads with mild comparative wording that is allowed, so over-reading is measured."}
  - {run: fix-ad, family: ad_review, task: zh-L2-01, check: R-AD-2, cause: prompt,
     why: "The targeted pattern in 1 of 3 trials: “95% 的用户一周见效” is still listed both as DATA and as GUARANTEE under CN-AL-28, against the new rule.",
     fix: "Enforce it in code: merge violations that quote the same words, keeping the category of the more specific clause."}
  - {run: fix-ad, family: ad_review, task: zh-L3-02, check: R-AD-1, cause: interaction,
     why: "In the first review the model sent two submit_review calls in one message, one of them a placeholder (decision reject, no violations, notes 'placeholder'). The agent's harness keeps the last finishing call of a message, and it kept the placeholder. The gate caught it: the decision and the empty violation list disagree, so the trial is held for a person.",
     fix: "Have the harness refuse a message with more than one finishing call and ask for one; keep the decision-consistency gate."}
  - {run: fix-ad, family: ad_review, task: zh-L3-03, check: R-AD-1, cause: model,
     why: "Not targeted, as predicted: “无可视频闪” in the advertiser's next version is still rejected as an absolute term, now in 3 of 3 trials.",
     fix: "As in base: a factual specification is not a violation unless a clause says so; add regression items with ordinary specifications."}

  # ---------------------------------------------------------------- business review, fix-biz
  - {run: fix-biz, family: biz, task: B02, check: R-BZ-2, cause: task,
     why: "As in base: the extra refund cause is on 美发美甲, a slice the monitor flags, with nothing planted there (predicted to stay).",
     fix: "As in base."}
  - {run: fix-biz, family: biz, task: B09, check: R-BZ-2, cause: prompt,
     why: "A side effect of the fix. The added rule says to locate store-closure causes at the merchant; in all 3 trials the agent also located this refund rise at a merchant (茶饮咖啡连锁A) inside the planted 深圳 × 茶饮咖啡 cell, and in two trials named a second cause beside it. Base got this task right in 2 of 3.",
     fix: "Keep the merchant rule to store closures in code (the lever decides the grain), or add to the rule that other levers stop at the segment where the change is spread; re-run B09 and the other refund tasks."}
  - {run: fix-biz, family: biz, task: B16, check: R-BZ-2, cause: model,
     why: "In the week after a holiday the agent names, beside the holiday, two conversion drops (火锅, 休闲娱乐) on slices the monitor did not flag for conversion, against the added rule that only flagged slices are causes.",
     fix: "Enforce the flagged-slice rule in code: a cause whose lever has no alert in its segment goes to a note."}
